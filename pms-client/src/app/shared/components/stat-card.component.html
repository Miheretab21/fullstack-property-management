<div class="card card-hover h-100 p-3">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <span class="text-muted fw-semibold small text-uppercase tracking-wider">{{ label }}</span>
    <div class="stat-icon-wrapper rounded-3 d-flex align-items-center justify-content-center" [ngClass]="iconBgClass">
      <i class="bi fs-5" [ngClass]="[icon, iconColorClass]"></i>
    </div>
  </div>
  <div class="d-flex align-items-baseline gap-2">
    <h3 class="mb-0 fw-bold">{{ value }}</h3>
    <span *ngIf="badgeText" class="badge" [ngClass]="badgeClass">{{ badgeText }}</span>
  </div>
  <div *ngIf="subtitle" class="mt-2 text-muted small">
    {{ subtitle }}
  </div>
</div>
